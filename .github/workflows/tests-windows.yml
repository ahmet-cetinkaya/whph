name: Tests (Windows)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/lib/infrastructure/windows/**'
      - 'src/lib/**/mcp/**'
      - 'src/test/infrastructure/windows/**'
      - 'src/test/**/mcp/**'
      - 'src/pubspec.lock'
      - '.github/workflows/tests-windows.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/lib/infrastructure/windows/**'
      - 'src/lib/**/mcp/**'
      - 'src/test/infrastructure/windows/**'
      - 'src/test/**/mcp/**'
      - 'src/pubspec.lock'
      - '.github/workflows/tests-windows.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Run Windows-Specific Tests
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize Submodules
        uses: ./.github/actions/setup-repository

      - name: Setup Flutter with FVM
        uses: ./.github/actions/setup-fvm
        with:
          cache-key-suffix: "windows-tests"

      - name: Install Flutter Dependencies
        uses: ./.github/actions/install-flutter-deps

      - name: Run build_runner
        shell: bash
        run: |
          cd src
          fvm dart run build_runner build --delete-conflicting-outputs

      - name: Run Windows-specific tests
        shell: bash
        run: |
          cd src
          fvm flutter test test/infrastructure/windows/

      - name: Run MCP platform contracts
        shell: bash
        run: |
          cd src
          fvm flutter test \
            test/presentation/mcp/ \
            test/infrastructure/shared/features/mcp/ \
            test/infrastructure/persistence/shared/contexts/drift/mcp_restore_barrier_test.dart

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: src/test-results/
          retention-days: 30
