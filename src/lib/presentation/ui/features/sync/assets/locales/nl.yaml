    from_label: Van
    help:
      content: "🔄 **Wat is synchroniseren?**\n\nSynchroniseren houdt je gewoontes, taken, notities en gegevens up-to-date op je apparaten op hetzelfde wifi-netwerk. Geen cloud of internet: je gegevens blijven privé en lokaal.\n\n## 🛠️ **Synchronisatie inschakelen**\n\n1. Houd WHPH open op beide apparaten, op hetzelfde wifi-netwerk.\n2. Kies op één apparaat 'Apparaat toevoegen' en toon de QR-code.\n3. Scan de code met het andere apparaat en controleer of beide schermen dezelfde code tonen.\n4. Wijzigingen worden daarna automatisch gesynchroniseerd.\n\n## 📋 **Apparaten beheren**\n\n- **Bekijken:** Zie apparaten, synchronisatietijden en status in de synchronisatie-instellingen.\n- **Handmatig synchroniseren:** Tik op de knop bij het apparaat.\n- **Verwijderen:** Selecteer een apparaat en verwijder het om te stoppen met synchroniseren.\n\n## 🔧 **Probleemoplossing**\n\n1. Hetzelfde wifi-netwerk? Geen VPN.\n2. Start de app opnieuw.\n3. Test zonder firewall.\n\n**Geen apparaten?**\n- Stabiel wifi, geen proxy's.\n- Vernieuw het zoeken."
      title: Hulp bij apparaat-synchronisatie
