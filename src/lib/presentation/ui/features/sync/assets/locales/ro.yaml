    from_label: De la
    help:
      content: "🔄 **Ce este sincronizarea?**\n\nSincronizarea păstrează obiceiurile, sarcinile, notițele și datele actualizate pe dispozitivele din aceeași rețea Wi-Fi. Fără cloud sau internet: datele rămân private și locale.\n\n## 🛠️ **Activarea sincronizării**\n\n1. Ține WHPH deschis pe ambele dispozitive, în aceeași rețea Wi-Fi.\n2. Pe un dispozitiv alege „Adaugă dispozitiv” și afișează codul QR.\n3. Scanează-l cu celălalt dispozitiv și verifică dacă ambele ecrane arată același cod.\n4. Modificările se sincronizează apoi automat.\n\n## 📋 **Gestionarea dispozitivelor**\n\n- **Vezi:** Vezi dispozitivele, orele de sincronizare și starea în setările de sincronizare.\n- **Sincronizare manuală:** Atinge butonul de lângă dispozitiv.\n- **Elimină:** Selectează un dispozitiv și elimină-l pentru a opri sincronizarea.\n\n## 🔧 **Depanare**\n\n1. Aceeași rețea Wi-Fi? Fără VPN.\n2. Repornește aplicația.\n3. Testează fără firewall.\n\n**Niciun dispozitiv?**\n- Wi-Fi stabil, fără proxy.\n- Reîmprospătează căutarea."
      title: Ajutor sincronizare dispozitive
