    from_label: De
    help:
      content: '🔄 **O que é Sync?**


        O Sync mantém seus hábitos, tarefas, notas e dados atualizados em todos os
        dispositivos (telefones, tablets, laptops, desktops) na mesma Wi-Fi. Sem cloud
        ou internet — os dados permanecem privados e locais.


        É simples de usar: Configure uma vez, e as mudanças sincronizam automaticamente
        ou sob demanda. Mude de dispositivos sem problemas, como começar no telefone
        e terminar no PC.


        ## 🔗 **Modos de Sync**


        Todos os dispositivos suportam modos Cliente ou Servidor para sincronização
        flexível. O Servidor lidera (compartilha dados), os Clientes se juntam e trocam.
        Precisa de pelo menos um Servidor.


        - **Modo Cliente:** Conecta-se a um Servidor para sincronizar. Ideal para
        juntar-se a grupos via QR ou entrada manual.

        - **Modo Servidor:** Atua como hub; mostra QR ou string para outros se conectarem.


        **Notas de Plataforma:**

        - **Móvel:** Alterne via ícone de hotspot Wi-Fi. Servidor para hubs portáteis.

        - **Desktop (Padrão: Servidor):** Altere nas configurações de Sync. Cliente
        para laptops sincronizando com PCs principais.


        **Exemplos:** Móvel-para-móvel (um Servidor), desktop-para-móvel (de qualquer
        forma), desktop-para-desktop (um Servidor, um Cliente).


        Altere modos nas configurações de Sync; o app lembra sua escolha.


        ## 🛠️ **Habilitar Sync**


        Os dispositivos devem compartilhar Wi-Fi; mantenha WHPH aberto.


        ### **Configuração com Código QR**

        1. Servidor: Inicie modo Servidor em Sync — QR aparece.

        2. Cliente: "Adicionar Dispositivo" > Escanear QR.

        3. Conecta e sincroniza automaticamente.


        Suporta todas as combinações.


        ### **String de Conexão**

        1. Servidor: Copie string (ex. "whph://IP:44040?...") de Sync.

        2. Cliente: "Adicionar Dispositivo" > Manual > Colar string > Conectar.


        Não requer câmera.


        ### **Entrada Manual**

        1. Servidor: Anote IP/porta (padrão 44040) de Info de Conexão.

        2. Cliente: "Adicionar Dispositivo" > Manual > Inserir IP, porta, nome > Testar
        > Conectar.


        **Clientes Desktop:** Mude para modo Cliente primeiro, depois conecte. Sincroniza
        automaticamente; mude de volta a qualquer momento.


        Ative reconexão automática nas configurações para confiabilidade.


        ## 📋 **Gerenciar Dispositivos**


        - **Ver:** Veja dispositivos, tempos de sync, status nas configurações de
        Sync.

        - **Sync Manual:** Toque botão por dispositivo.

        - **Remover:** Selecione e remova para parar sync.


        ## 🔧 **Solução de Problemas**


        **Problemas de Conexão:**

        1. Mesma Wi-Fi? Sem VPNs.

        2. Reinicie o app.

        3. Verifique modo Servidor.

        4. Teste sem firewall.


        **Sem Dispositivos?**

        - Wi-Fi estável, sem proxies.

        - Atualize scan.

        - Use IP manual.


        **Sync Falha/Timeouts:**

        1. Sync manual.

        2. Combine versões do app.

        3. Espere por dados grandes.


        **Firewall (Porta 44040):**


        Se as conexões não funcionarem, o firewall do seu computador pode estar bloqueando
        o sinal de sync. Abra a porta 44040 para permitir que os dispositivos se comuniquem
        localmente — é seguro para sua rede doméstica.


        **Windows (GUI):**

        1. Abra Defender Firewall > Avançado > Regras de Entrada > Nova Regra.

        2. Porta > TCP > 44040 > Permitir > Todos os perfis > Nomeie "WHPH Sync" >
        Concluir.


        **Windows (CMD Admin):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Dicas: Reinicie o roteador, use redes privadas. Re-emparelhe se erros "não
        encontrado".

        '
