    from_label: De
    help:
      content: "🔄 **O que é a sincronização?**\n\nA sincronização mantém os seus hábitos, tarefas, notas e dados atualizados nos seus dispositivos na mesma rede Wi-Fi. Sem nuvem nem internet: os dados continuam privados e locais.\n\n## 🛠️ **Ativar a sincronização**\n\n1. Mantenha o WHPH aberto nos dois dispositivos, na mesma rede Wi-Fi.\n2. Num dispositivo, escolha \"Adicionar dispositivo\" e mostre o código QR.\n3. Leia-o com o outro dispositivo e confirme que os dois ecrãs mostram o mesmo código.\n4. As alterações passam a sincronizar automaticamente.\n\n## 📋 **Gerir dispositivos**\n\n- **Ver:** Veja dispositivos, horas de sincronização e estado nas definições de sincronização.\n- **Sincronização manual:** Toque no botão de cada dispositivo.\n- **Remover:** Selecione um dispositivo e remova-o para parar a sincronização.\n\n## 🔧 **Resolução de problemas**\n\n1. Mesma rede Wi-Fi? Sem VPN.\n2. Reinicie a aplicação.\n3. Teste sem firewall.\n\n**Sem dispositivos?**\n- Wi-Fi estável, sem proxy.\n- Atualize a pesquisa."
      title: Ajuda de sincronização de dispositivos
