    from_label: Od
    help:
      content: "🔄 **Czym jest synchronizacja?**\n\nSynchronizacja utrzymuje aktualność nawyków, zadań, notatek i danych na urządzeniach w tej samej sieci Wi-Fi. Bez chmury i internetu: dane pozostają prywatne i lokalne.\n\n## 🛠️ **Włączanie synchronizacji**\n\n1. Pozostaw WHPH otwarte na obu urządzeniach w tej samej sieci Wi-Fi.\n2. Na jednym urządzeniu wybierz „Dodaj urządzenie” i pokaż kod QR.\n3. Zeskanuj go drugim urządzeniem i sprawdź, czy oba ekrany pokazują ten sam kod.\n4. Zmiany będą potem synchronizowane automatycznie.\n\n## 📋 **Zarządzanie urządzeniami**\n\n- **Podgląd:** Urządzenia, czasy synchronizacji i stan zobaczysz w ustawieniach synchronizacji.\n- **Synchronizacja ręczna:** Dotknij przycisku przy urządzeniu.\n- **Usuń:** Wybierz urządzenie i usuń je, aby zatrzymać synchronizację.\n\n## 🔧 **Rozwiązywanie problemów**\n\n1. Ta sama sieć Wi-Fi? Bez VPN.\n2. Uruchom aplikację ponownie.\n3. Spróbuj bez zapory.\n\n**Brak urządzeń?**\n- Stabilne Wi-Fi, bez serwerów proxy.\n- Odśwież wyszukiwanie."
      title: Pomoc synchronizacji urządzeń
