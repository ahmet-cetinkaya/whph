    from_label: Od
    help:
      content: "🔄 **Kaj je sinhronizacija?**\n\nSinhronizacija ohranja vaše navade, naloge, zapiske in podatke posodobljene na napravah v istem omrežju Wi-Fi. Brez oblaka ali interneta: podatki ostanejo zasebni in lokalni.\n\n## 🛠️ **Vklop sinhronizacije**\n\n1. Pustite WHPH odprt na obeh napravah v istem omrežju Wi-Fi.\n2. Na eni napravi izberite »Dodaj napravo« in prikažite kodo QR.\n3. Skenirajte jo z drugo napravo in preverite, ali sta na obeh zaslonih enaki kodi.\n4. Spremembe se nato samodejno sinhronizirajo.\n\n## 📋 **Upravljanje naprav**\n\n- **Ogled:** Naprave, čase sinhronizacije in stanje najdete v nastavitvah sinhronizacije.\n- **Ročna sinhronizacija:** Tapnite gumb ob napravi.\n- **Odstrani:** Izberite napravo in jo odstranite, da ustavite sinhronizacijo.\n\n## 🔧 **Odpravljanje težav**\n\n1. Isto omrežje Wi-Fi? Brez VPN.\n2. Znova zaženite aplikacijo.\n3. Preizkusite brez požarnega zidu.\n\n**Ni naprav?**\n- Stabilen Wi-Fi, brez posrednika.\n- Osvežite iskanje."
      title: Pomoč sinhronizaciji naprav
