    from_label: Від
    help:
      content: '🔄 **Що таке Sync?**


        Sync тримає ваші звички, завдання, нотатки та дані оновленими на всіх пристроях
        (телефони, планшети, ноутбуки, десктопи) в одній мережі Wi-Fi. Без хмари чи
        інтернету — дані залишаються приватними та локальними.


        Простий у використанні: налаштуйте один раз, і зміни синхронізуються автоматично
        або за запитом. Перемикайтеся між пристроями безшовно, наприклад, починайте
        на телефоні та завершуйте на ПК.


        ## 🔗 **Режими Sync**


        Усі пристрої підтримують режими клієнта або сервера для гнучкої синхронізації.
        Сервер керує (ділиться даними), клієнти приєднуються та обмінюються. Потрібен
        щонайменше один сервер.


        - **Режим клієнта:** Підключається до сервера для синхронізації. Ідеально
        для приєднання до груп через QR або ручний ввід.

        - **Режим сервера:** Діє як хаб; показує QR або рядок для підключення інших.


        **Примітки до платформ:**

        - **Мобільні:** Перемикайте через іконку гарячої точки Wi-Fi. Сервер для портативних
        хабів.

        - **Робочий стіл (За замовчуванням: Сервер):** Перемикайте в налаштуваннях
        Sync. Клієнт для ноутбуків, що синхронізуються з основними ПК.


        **Приклади:** Мобільний-на-мобільний (один сервер), робочий стіл-на-мобільний
        (в обидва боки), робочий стіл-на-робочий стіл (один сервер, один клієнт).


        Перемикайте режими в налаштуваннях Sync; додаток запам''ятовує ваш вибір.


        ## 🛠️ **Увімкнення Sync**


        Пристрої повинні ділити Wi-Fi; тримайте WHPH відкритим.


        ### **Налаштування з QR-кодом**

        1. Сервер: Запустіть режим сервера в Sync — з''явиться QR.

        2. Клієнт: „Додати пристрій” > Сканувати QR.

        3. Автоматично підключається та синхронізується.


        Підтримує всі комбінації.


        ### **Рядок підключення**

        1. Сервер: Скопіюйте рядок (наприклад, „whph://IP:44040?...”) з Sync.

        2. Клієнт: „Додати пристрій” > Ручний > Вставте рядок > Підключити.


        Камера не потрібна.


        ### **Ручний ввід**

        1. Сервер: Запишіть IP/порт (за замовчуванням 44040) з інформації про підключення.

        2. Клієнт: „Додати пристрій” > Ручний > Введіть IP, порт, ім''я > Тест > Підключити.


        **Клієнти робочого столу:** Спочатку переключіться в режим клієнта, потім
        підключіться. Автоматична синхронізація; переключіться назад у будь-який час.


        Увімкніть автоматичне перепідключення в налаштуваннях для надійності.


        ## 📋 **Керування пристроями**


        - **Перегляд:** Дивіться пристрої, часи синхронізації, статус у налаштуваннях
        Sync.

        - **Ручна синхронізація:** Натисніть кнопку для кожного пристрою.

        - **Видалити:** Виберіть та видаліть, щоб зупинити синхронізацію.


        ## 🔧 **Усунення несправностей**


        **Проблеми з підключенням:**

        1. Та сама Wi-Fi? Без VPN.

        2. Перезапустіть додаток.

        3. Перевірте режим сервера.

        4. Тестуйте без брандмауера.


        **Немає пристроїв?**

        - Стабільна Wi-Fi, без проксі.

        - Оновіть сканування.

        - Використовуйте ручний IP.


        **Синхронізація не вдалася/Тайм-аути:**

        1. Ручна синхронізація.

        2. Зіставте версії додатків.

        3. Зачекайте на великі дані.


        **Брандмауер (Порт 44040):**


        Якщо підключення не працюють, брандмауер вашого комп''ютера може блокувати
        сигнал синхронізації. Відкрийте порт 44040, щоб дозволити пристроям локально
        спілкуватися — це безпечно для вашої домашньої мережі.


        **Windows (GUI):**

        1. Відкрийте Defender Брандмауер > Розширені > Вхідні правила > Нове правило.

        2. Порт > TCP > 44040 > Дозволити > Усі профілі > Назвіть „WHPH Sync” > Завершити.


        **Windows (Адмін CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Поради: Перезапустіть роутер, використовуйте приватні мережі. Перепарте при
        помилках „не знайдено”.

