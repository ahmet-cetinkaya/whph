    from_label: Від
    help:
      content: "🔄 **Що таке синхронізація?**\n\nСинхронізація підтримує актуальність ваших звичок, завдань, нотаток і даних на пристроях в одній мережі Wi-Fi. Без хмари та інтернету: дані залишаються приватними й локальними.\n\n## 🛠️ **Увімкнення синхронізації**\n\n1. Тримайте WHPH відкритим на обох пристроях в одній мережі Wi-Fi.\n2. На одному пристрої виберіть «Додати пристрій» і покажіть QR-код.\n3. Відскануйте його іншим пристроєм і переконайтеся, що на обох екранах той самий код.\n4. Далі зміни синхронізуються автоматично.\n\n## 📋 **Керування пристроями**\n\n- **Перегляд:** пристрої, час синхронізації та стан видно в налаштуваннях синхронізації.\n- **Ручна синхронізація:** натисніть кнопку біля пристрою.\n- **Видалення:** виберіть пристрій і видаліть його, щоб зупинити синхронізацію.\n\n## 🔧 **Усунення несправностей**\n\n1. Та сама мережа Wi-Fi? Без VPN.\n2. Перезапустіть застосунок.\n3. Перевірте без брандмауера.\n\n**Немає пристроїв?**\n- Стабільний Wi-Fi, без проксі.\n- Оновіть пошук."
      title: Довідка синхронізації пристроїв
