      sync_failed: Laitteiden synkronointi epäonnistui
    from_label: Mistä
    help:
      content: '🔄 **Mikä on Sync?**


        Sync pitää tapasi, tehtäväsi, muistiinpanosi ja tietosi ajan tasalla eri laitteilla
        (puhelimet, tabletit, kannettavat, työpöydät) samassa Wi-Fi-verkossa. Ei pilveä
        tai internetiä — tiedot pysyvät yksityisinä ja paikallisina.


        Se on helppo käyttää: Aseta se kerralla, ja muutokset synkronoituvat automaattisesti
        tai pyynnöstä. Vaihda laitteita saumattomasti, kuten aloita puhelimella ja
        lopeta PC:llä.


        ## 🔗 **Synkronointitilat**


        Kaikki laitteet tukevat Klientti- tai Server-tiloja joustavaan synkronointiin.
        Server johtaa (jakaa tietoja), Klientit liittyvät ja vaihtavat. Tarvitset
        ainakin yhden Serverin.


        - **Klientti-tila:** Yhdistyy Serveriin synkronoimiseksi. Ihanteellinen ryhmien
        liittymiseen QR:llä tai manuaalisella syötteellä.

        - **Server-tila:** Toimii keskuspaikkana; näyttää QR:n tai merkkijonon muille
        liittymään.


        **Alustahuomautukset:**

        - **Mobiili:** Vaihda Wi-Fi-hotspot-kuvakkeen kautta. Server kannettaville
        keskuspaikoille.

        - **Työpöytä (Oletus: Server):** Vaihda Sync-asetuksissa. Klientti kannettaville,
        jotka synkronoivat pää-PC:ihin.


        **Esimerkit:** Mobiili-mobiilille (yksi Server), työpöytä-mobiilille (kumpaankin
        suuntaan), työpöytä-työpöydälle (yksi Server, yksi Klientti).


        Vaihda tiloja Sync-asetuksissa; sovellus muistaa valintasi.


        ## 🛠️ **Synkronoinnin Käynnistäminen**


        Laitteiden täytyy jakaa Wi-Fi; pidä WHPH auki.


        ### **QR-Koodin Asetus**

        1. Server: Käynnistä Server-tila Syncissä — QR ilmestyy.

        2. Klientti: "Lisää laite" > Skannaa QR.

        3. Yhdistyy ja synkronoi automaattisesti.


        Tukee kaikkia yhdistelmiä.


        ### **Yhteyden Merkkijono**

        1. Server: Kopioi merkkijono (esim. "whph://IP:44040?...") Syncistä.

        2. Klientti: "Lisää laite" > Manuaalinen > Liitä merkkijono > Yhdistä.


        Ei vaadi kameraa.


        ### **Manuaalinen Syöttö**

        1. Server: Merkitse IP/portti (oletus 44040) Yhteyden tiedoista.

        2. Klientti: "Lisää laite" > Manuaalinen > Syötä IP, portti, nimi > Testaa
        > Yhdistä.


        **Työpöydän Klientit:** Vaihda Klientti-tilaan ensin, sitten yhdistä. Synkronoi
        automaattisesti; vaihda takaisin milloin tahansa.


        Ota käyttöön automaattinen uudelleenyhteys asetuksissa luotettavuuden vuoksi.


        ## 📋 **Laitteiden Hallinta**


        - **Näytä:** Näet laitteet, synkronointiajat, tilan Sync-asetuksissa.

        - **Manuaalinen Sync:** Napauta nappia per laite.

        - **Poista:** Valitse ja poista synkronoinnin lopettamiseksi.


        ## 🔧 **Vianetsintä**


        **Yhteysongelmat:**

        1. Sama Wi-Fi? Ei VPN:ää.

        2. Käynnistä sovellus uudelleen.

        3. Vahvista Server-tila.

        4. Testaa ilman palomuuria.


        **Ei laitteita?**

        - Vakaa Wi-Fi, ei proxyja.

        - Päivitä skannaus.

        - Käytä manuaalista IP:tä.


        **Sync Epäonnistuu/Aikakatkot:**

        1. Manuaalinen sync.

        2. Vastaa sovelluksen versioita.

        3. Odota suuria tietoja.


        **Palomuuri (Portti 44040):**


        Jos yhteydet eivät toimi, tietokoneesi palomuuri saattaa estää sync-signaalin.
        Avaa portti 44040, jotta laitteet voivat kommunikoida paikallisesti — se on
        turvallista kotiverkollesi.


        **Windows (GUI):**

        1. Avaa Defender Palomuuri > Edistynyt > Saapuvat säännöt > Uusi sääntö.

        2. Portti > TCP > 44040 > Salli > Kaikki profiilit > Nimi "WHPH Sync" > Valmis.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Vinkkejä: Käynnistä reititin uudelleen, käytä yksityisiä verkkoja. Yhdistä
        uudelleen "ei löytynyt" virheissä.

        '
