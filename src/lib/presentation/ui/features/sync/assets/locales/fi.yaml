    from_label: Mistä
    help:
      content: "🔄 **Mitä synkronointi on?**\n\nSynkronointi pitää tapasi, tehtäväsi, muistiinpanosi ja tietosi ajan tasalla laitteillasi, jotka ovat samassa Wi-Fi-verkossa. Ei pilveä tai internetiä: tiedot pysyvät yksityisinä ja paikallisina.\n\n## 🛠️ **Synkronoinnin käyttöönotto**\n\n1. Pidä WHPH auki molemmilla laitteilla samassa Wi-Fi-verkossa.\n2. Valitse yhdellä laitteella \"Lisää laite\" ja näytä QR-koodi.\n3. Skannaa se toisella laitteella ja tarkista, että molemmat näytöt näyttävät saman koodin.\n4. Muutokset synkronoituvat sen jälkeen automaattisesti.\n\n## 📋 **Laitteiden hallinta**\n\n- **Näytä:** Näet laitteet, synkronointiajat ja tilan synkronointiasetuksissa.\n- **Manuaalinen synkronointi:** Napauta laitteen painiketta.\n- **Poista:** Valitse laite ja poista se lopettaaksesi synkronoinnin.\n\n## 🔧 **Vianmääritys**\n\n1. Sama Wi-Fi? Ei VPN:ää.\n2. Käynnistä sovellus uudelleen.\n3. Kokeile ilman palomuuria.\n\n**Ei laitteita?**\n- Vakaa Wi-Fi, ei välityspalvelimia.\n- Päivitä haku."
      title: Laitteiden synkronointiapu
