    from_label: Kimden
    help:
      content: "🔄 **Senkronizasyon nedir?**\n\nSenkronizasyon, alışkanlıklarınızı, görevlerinizi, notlarınızı ve verilerinizi aynı Wi-Fi ağındaki cihazlarınızda güncel tutar. Bulut ya da internet yok: veriler özel ve yerel kalır.\n\n## 🛠️ **Senkronizasyonu etkinleştirme**\n\n1. WHPH'yi her iki cihazda da aynı Wi-Fi ağında açık tutun.\n2. Bir cihazda \"Cihaz Ekle\"yi seçip QR kodunu gösterin.\n3. Diğer cihazla tarayın ve her iki ekranda aynı kodun göründüğünü kontrol edin.\n4. Değişiklikler daha sonra otomatik olarak senkronize edilir.\n\n## 📋 **Cihazları yönetme**\n\n- **Görüntüle:** Cihazları, senkronizasyon zamanlarını ve durumu senkronizasyon ayarlarında görün.\n- **Manuel senkronizasyon:** Cihazın yanındaki düğmeye dokunun.\n- **Kaldır:** Bir cihazı seçip kaldırarak senkronizasyonu durdurun.\n\n## 🔧 **Sorun giderme**\n\n1. Aynı Wi-Fi ağı mı? VPN yok.\n2. Uygulamayı yeniden başlatın.\n3. Güvenlik duvarı olmadan deneyin.\n\n**Cihaz yok mu?**\n- Kararlı Wi-Fi, proxy yok.\n- Aramayı yenileyin."
      title: Cihaz Senkronizasyonu Yardımı
