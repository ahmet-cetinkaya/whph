    from_label: От
    help:
      content: "🔄 **Что такое синхронизация?**\n\nСинхронизация обновляет ваши привычки, задачи, заметки и данные на устройствах в одной сети Wi-Fi. Без облака и интернета: данные остаются приватными и локальными.\n\n## 🛠️ **Включение синхронизации**\n\n1. Держите WHPH открытым на обоих устройствах в одной сети Wi-Fi.\n2. На одном устройстве выберите «Добавить устройство» и покажите QR-код.\n3. Отсканируйте его другим устройством и убедитесь, что на обоих экранах один и тот же код.\n4. Затем изменения синхронизируются автоматически.\n\n## 📋 **Управление устройствами**\n\n- **Просмотр:** устройства, время синхронизации и статус видны в настройках синхронизации.\n- **Ручная синхронизация:** нажмите кнопку у устройства.\n- **Удаление:** выберите устройство и удалите его, чтобы остановить синхронизацию.\n\n## 🔧 **Устранение неполадок**\n\n1. Та же сеть Wi-Fi? Без VPN.\n2. Перезапустите приложение.\n3. Проверьте без брандмауэра.\n\n**Нет устройств?**\n- Стабильный Wi-Fi, без прокси.\n- Обновите поиск."
      title: Помощь по синхронизации устройств
