    from_label: От
    help:
      content: '🔄 **Что такое Sync?**


        Sync поддерживает ваши привычки, задачи, заметки и данные в актуальном состоянии
        на всех устройствах (телефонах, планшетах, ноутбуках, десктопах) в одной Wi-Fi-сети.
        Без облака или интернета — данные остаются приватными и локальными.


        Это просто в использовании: настройте один раз, и изменения синхронизируются
        автоматически или по требованию. Переключайтесь между устройствами без проблем,
        как начать на телефоне и завершить на ПК.


        ## 🔗 **Режимы Sync**


        Все устройства поддерживают режимы Клиент или Сервер для гибкой синхронизации.
        Сервер ведет (делится данными), Клиенты присоединяются и обмениваются. Требуется
        хотя бы один Сервер.


        - **Режим клиента:** Подключается к Серверу для синхронизации. Идеально для
        присоединения к группам через QR или ручной ввод.

        - **Режим сервера:** Действует как хаб; показывает QR или строку для подключения
        других.


        **Примечания к платформам:**

        - **Мобильные:** Переключайте через иконку hotspot Wi-Fi. Сервер для портативных
        хабов.

        - **Десктоп (по умолчанию: Сервер):** Переключайте в настройках Sync. Клиент
        для ноутбуков, синхронизирующих с основными ПК.


        **Примеры:** Мобильное-к-мобильному (один Сервер), десктоп-к-мобильному (в
        любом направлении), десктоп-к-десктопу (один Сервер, один Клиент).


        Переключайте режимы в настройках Sync; приложение запоминает ваш выбор.


        ## 🛠️ **Включение Sync**


        Устройства должны делить Wi-Fi; держите WHPH открытым.


        ### **Настройка с QR-кодом**

        1. Сервер: Запустите режим Сервер в Sync — появится QR.

        2. Клиент: "Добавить устройство" > Сканировать QR.

        3. Автоматически подключается и синхронизируется.


        Поддерживает все комбинации.


        ### **Строка подключения**

        1. Сервер: Скопируйте строку (напр., "whph://IP:44040?...") из Sync.

        2. Клиент: "Добавить устройство" > Ручной > Вставить строку > Подключиться.


        Камера не требуется.


        ### **Ручной ввод**

        1. Сервер: Запишите IP/порт (по умолчанию 44040) из Инфо о подключении.

        2. Клиент: "Добавить устройство" > Ручной > Введите IP, порт, имя > Тест >
        Подключиться.


        **Клиенты десктопа:** Сначала переключитесь в режим Клиента, затем подключитесь.
        Автоматическая синхронизация; переключайтесь обратно в любое время.


        Включите автоматическое переподключение в настройках для надежности.


        ## 📋 **Управление устройствами**


        - **Просмотр:** Видьте устройства, времена sync, статус в настройках Sync.

        - **Ручная sync:** Нажмите кнопку на устройство.

        - **Удалить:** Выберите и удалите, чтобы остановить sync.


        ## 🔧 **Устранение неисправностей**


        **Проблемы подключения:**

        1. Одна Wi-Fi? Без VPN.

        2. Перезапустите приложение.

        3. Проверьте режим Сервер.

        4. Тестируйте без файрвола.


        **Нет устройств?**

        - Стабильный Wi-Fi, без прокси.

        - Обновите сканирование.

        - Используйте ручной IP.


        **Sync не удался/Тайм-ауты:**

        1. Ручная sync.

        2. Согласуйте версии приложений.

        3. Подождите для больших данных.


        **Файрвол (Порт 44040):**


        Если подключения не работают, файрвол вашего компьютера может блокировать
        сигнал sync. Откройте порт 44040, чтобы устройства могли общаться локально
        — безопасно для домашней сети.


        **Windows (GUI):**

        1. Откройте Defender Firewall > Расширенно > Входящие правила > Новое правило.

        2. Порт > TCP > 44040 > Разрешить > Все профили > Назовите "WHPH Sync" > Завершить.


        **Windows (CMD Админ):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Советы: Перезапустите роутер, используйте приватные сети. Перепарьте при ошибках
        "не найдено".

        '
