    from_label: Från
    help:
      content: "🔄 **Vad är synkronisering?**\n\nSynkronisering håller dina vanor, uppgifter, anteckningar och data uppdaterade på dina enheter på samma Wi-Fi. Inget moln eller internet: data förblir privata och lokala.\n\n## 🛠️ **Aktivera synkronisering**\n\n1. Låt WHPH vara öppet på båda enheterna, på samma Wi-Fi.\n2. Välj \"Lägg till enhet\" på den ena enheten och visa QR-koden.\n3. Skanna den med den andra enheten och kontrollera att båda skärmarna visar samma kod.\n4. Ändringar synkroniseras sedan automatiskt.\n\n## 📋 **Hantera enheter**\n\n- **Visa:** Se enheter, synkroniseringstider och status i synkroniseringsinställningarna.\n- **Manuell synkronisering:** Tryck på knappen vid enheten.\n- **Ta bort:** Välj en enhet och ta bort den för att sluta synkronisera.\n\n## 🔧 **Felsökning**\n\n1. Samma Wi-Fi? Inget VPN.\n2. Starta om appen.\n3. Testa utan brandvägg.\n\n**Inga enheter?**\n- Stabilt Wi-Fi, ingen proxy.\n- Uppdatera sökningen."
      title: Hjälp med enhetssynkronisering
