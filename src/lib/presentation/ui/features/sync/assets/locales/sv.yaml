    from_label: Från
    help:
      content: '🔄 **Vad är Sync?**


        Sync håller dina vanor, uppgifter, anteckningar och data uppdaterade över
        enheter (telefoner, surfplattor, bärbara datorer, stationära) på samma Wi-Fi.
        Inget moln eller internet — data förblir privata och lokala.


        Det är enkelt att använda: Ställ in en gång, och ändringar synkroniseras automatiskt
        eller på begäran. Byt enheter sömlöst, som att börja på telefonen och slutföra
        på PC:n.


        ## 🔗 **Synkroniseringslägen**


        Alla enheter stödjer klient- eller serverläge för flexibel synkronisering.
        Servern leder (delar data), klienterna ansluter och byter. Kräver minst en
        server.


        - **Klientläge:** Ansluter till en server för synkronisering. Idealiskt för
        att ansluta till grupper via QR eller manuell inmatning.

        - **Serverläge:** Fungerar som nav; visar QR eller sträng för andra att ansluta.


        **Plattformsnoteringar:**

        - **Mobil:** Byt via Wi-Fi-hotspot-ikonen. Server för portabla nav.

        - **Stationär (Standard: Server):** Byt i Sync-inställningar. Klient för bärbara
        som synkroniserar med huvud-PC:er.


        **Exempel:** Mobil-till-mobil (en server), stationär-till-mobil (båda vägar),
        stationär-till-stationär (en server, en klient).


        Byt lägen i Sync-inställningar; appen kommer ihåg ditt val.


        ## 🛠️ **Aktivera Sync**


        Enheterna måste dela Wi-Fi; håll WHPH öppen.


        ### **QR-kodinställning**

        1. Server: Starta serverläge i Sync — QR visas.

        2. Klient: „Lägg till enhet” > Skanna QR.

        3. Ansluter och synkroniserar automatiskt.


        Stödjer alla kombinationer.


        ### **Anslutningssträng**

        1. Server: Kopiera strängen (t.ex. „whph://IP:44040?...”) från Sync.

        2. Klient: „Lägg till enhet” > Manuell > Klistra in sträng > Anslut.


        Kräver ingen kamera.


        ### **Manuell inmatning**

        1. Server: Notera IP/port (standard 44040) från anslutningsinfo.

        2. Klient: „Lägg till enhet” > Manuell > Ange IP, port, namn > Test > Anslut.


        **Stationära klienter:** Byt till klientläge först, sedan anslut. Synkroniserar
        automatiskt; byt tillbaka när som helst.


        Aktivera automatisk omanslutning i inställningarna för tillförlitlighet.


        ## 📋 **Hantera enheter**


        - **Visa:** Se enheter, synkroniseringstider, status i Sync-inställningar.

        - **Manuell synkronisering:** Tryck knapp per enhet.

        - **Ta bort:** Välj och ta bort för att stoppa synkronisering.


        ## 🔧 **Felsökning**


        **Anslutningsproblem:**

        1. Samma Wi-Fi? Inga VPN:er.

        2. Starta om appen.

        3. Bekräfta serverläge.

        4. Testa utan brandvägg.


        **Inga enheter?**

        - Stabil Wi-Fi, inga proxyservrar.

        - Uppdatera skanning.

        - Använd manuell IP.


        **Synkronisering misslyckas/Timeouts:**

        1. Manuell synkronisering.

        2. Matcha appversioner.

        3. Vänta på stora data.


        **Brandvägg (Port 44040):**


        Om anslutningar inte fungerar kan brandväggen på din dator blockera synkroniseringssignalen.
        Öppna port 44040 för att låta enheter kommunicera lokalt — det är säkert för
        ditt hemnätverk.


        **Windows (GUI):**

        1. Öppna Defender Brandvägg > Avancerat > Inkommande regler > Ny regel.

        2. Port > TCP > 44040 > Tillåt > Alla profiler > Namnge „WHPH Sync” > Slutför.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Tips: Starta om routern, använd privata nätverk. Para om vid „inte hittat”-fel.

        '
