    from_label: Od
    help:
      content: "🔄 **Co je synchronizace?**\n\nSynchronizace udržuje vaše návyky, úkoly, poznámky a data aktuální na všech zařízeních ve stejné síti Wi-Fi. Bez cloudu a internetu: data zůstávají soukromá a místní.\n\n## 🛠️ **Zapnutí synchronizace**\n\n1. Nechte WHPH otevřené na obou zařízeních ve stejné síti Wi-Fi.\n2. Na jednom zařízení zvolte „Přidat zařízení“ a zobrazte QR kód.\n3. Naskenujte jej druhým zařízením a zkontrolujte, že obě obrazovky ukazují stejný kód.\n4. Změny se pak synchronizují automaticky.\n\n## 📋 **Správa zařízení**\n\n- **Zobrazit:** Zařízení, časy synchronizace a stav najdete v nastavení synchronizace.\n- **Ruční synchronizace:** Klepněte na tlačítko u zařízení.\n- **Odebrat:** Vyberte zařízení a odeberte ho, aby se přestalo synchronizovat.\n\n## 🔧 **Řešení potíží**\n\n1. Stejná síť Wi-Fi? Žádné VPN.\n2. Restartujte aplikaci.\n3. Zkuste to bez firewallu.\n\n**Žádná zařízení?**\n- Stabilní Wi-Fi, žádné proxy.\n- Obnovte vyhledávání."
      title: Nápověda ke synchronizaci zařízení
