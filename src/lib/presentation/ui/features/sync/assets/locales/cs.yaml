    from_label: Od
    help:
      content: '🔄 **Co je Sync?**


        Sync udržuje vaše návyky, úkoly, poznámky a data aktualizované napříč zařízeními
        (telefony, tablety, notebooky, desktopy) ve stejné Wi-Fi síti. Žádný cloud
        nebo internet — data zůstávají soukromá a lokální.


        Je jednoduché na použití: Nastavte to jednou a změny se synchronizují automaticky
        nebo na požádání. Přepínejte mezi zařízeními plynule, např. začněte na telefonu
        a dokončete na PC.


        ## 🔗 **Režimy Sync**


        Všechna zařízení podporují režimy Klienta nebo Serveru pro flexibilní synchronizaci.
        Server vede (sdílí data), Klienti se připojují a vyměňují. Potřebujete nejméně
        jeden Server.


        - **Režim klienta:** Připojuje se k Serveru pro synchronizaci. Ideální pro
        připojení k skupinám přes QR nebo manuální vstup.

        - **Režim serveru:** Funguje jako uzel; zobrazuje QR nebo řetězec pro připojení
        ostatních.


        **Poznámky k platformám:**

        - **Mobil:** Přepínejte přes ikonu Wi-Fi hotspotu. Server pro přenosné uzly.

        - **Desktop (Výchozí: Server):** Přepínejte v nastavení Sync. Klient pro notebooky
        synchronizující s hlavními PC.


        **Příklady:** Mobil-k-mobilu (jeden Server), desktop-k-mobilu (obě cesty),
        desktop-k-desktopu (jeden Server, jeden Klient).


        Přepínejte režimy v nastavení Sync; aplikace si zapamatuje vaši volbu.


        ## 🛠️ **Povolení Sync**


        Zařízení musí sdílet Wi-Fi; udržujte WHPH otevřený.


        ### **Nastavení QR Kódu**

        1. Server: Spusťte režim Serveru v Sync — objeví se QR.

        2. Klient: "Přidat zařízení" > Skenovat QR.

        3. Automaticky se připojí a synchronizuje.


        Podporuje všechny kombinace.


        ### **Řetězec Připojení**

        1. Server: Zkopírujte řetězec (např. "whph://IP:44040?...") ze Sync.

        2. Klient: "Přidat zařízení" > Manuální > Vložit řetězec > Připojit.


        Není potřeba kamera.


        ### **Manuální Vstup**

        1. Server: Zapište IP/port (výchozí 44040) z Informací o připojení.

        2. Klient: "Přidat zařízení" > Manuální > Zadat IP, port, název > Test > Připojit.


        **Desktopoví Klienti:** Nejprve přepněte do režimu Klienta, pak se připojte.
        Automaticky synchronizuje; přepněte zpět kdykoli.


        Povolte automatické opětovné připojení v nastavení pro spolehlivost.


        ## 📋 **Správa Zařízení**


        - **Zobrazit:** Vidíte zařízení, časy synchronizace, stav v nastavení Sync.

        - **Manuální Sync:** Klepněte na tlačítko pro každé zařízení.

        - **Odstranit:** Vyberte a odstraňte pro zastavení synchronizace.


        ## 🔧 **Řešení problémů**


        **Problémy s připojením:**

        1. Stejná Wi-Fi? Žádné VPN.

        2. Restartujte aplikaci.

        3. Ověřte režim Serveru.

        4. Testujte bez firewallu.


        **Žádná zařízení?**

        - Stabilní Wi-Fi, žádné proxy.

        - Obnovte sken.

        - Použijte manuální IP.


        **Selhání Sync/Timeouts:**

        1. Manuální sync.

        2. Shodněte verze aplikací.

        3. Počkejte na velká data.


        **Firewall (Port 44040):**


        Pokud připojení nefungují, firewall vašeho počítače může blokovat signál sync.
        Otevřete port 44040, aby zařízení mohla lokálně komunikovat — je bezpečné
        pro vaši domácí síť.


        **Windows (GUI):**

        1. Otevřete Defender Firewall > Pokročilé > Pravidla příchozích > Nové pravidlo.

        2. Port > TCP > 44040 > Povolit > Všechny profily > Název "WHPH Sync" > Dokončit.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Tipy: Restartujte router, používejte soukromé sítě. Znovu spárujte při chybách
        "nenalezeno".

        '
