    from_label: De
    help:
      content: "🔄 **Qu'est-ce que la synchronisation ?**\n\nLa synchronisation garde vos habitudes, tâches, notes et données à jour sur vos appareils connectés au même Wi-Fi. Pas de cloud ni d'internet : les données restent privées et locales.\n\n## 🛠️ **Activer la synchronisation**\n\n1. Gardez WHPH ouvert sur les deux appareils, sur le même Wi-Fi.\n2. Sur un appareil, choisissez « Ajouter un appareil » et affichez le code QR.\n3. Scannez-le avec l'autre appareil et vérifiez que les deux écrans affichent le même code.\n4. Les modifications se synchronisent ensuite automatiquement.\n\n## 📋 **Gérer les appareils**\n\n- **Afficher :** Consultez les appareils, les heures de synchronisation et l'état dans les paramètres de synchronisation.\n- **Synchronisation manuelle :** Appuyez sur le bouton de l'appareil.\n- **Supprimer :** Sélectionnez un appareil et supprimez-le pour arrêter la synchronisation.\n\n## 🔧 **Dépannage**\n\n1. Même Wi-Fi ? Pas de VPN.\n2. Redémarrez l'application.\n3. Testez sans pare-feu.\n\n**Aucun appareil ?**\n- Wi-Fi stable, pas de proxy.\n- Actualisez la recherche."
      title: Aide à la synchronisation des appareils
