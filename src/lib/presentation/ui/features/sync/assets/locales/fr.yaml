    from_label: De
    help:
      content: '🔄 **Qu''est-ce que la synchronisation ?**


        La synchronisation maintient vos habitudes, tâches, notes et données à jour
        entre les appareils (téléphones, tablettes, ordinateurs portables, bureaux)
        sur le même Wi-Fi. Pas de cloud ni d''internet — les données restent privées
        et locales.


        C''est simple à utiliser : configurez-la une fois, et les changements se synchronisent
        automatiquement ou à la demande. Passez d''un appareil à l''autre sans effort,
        comme commencer sur votre téléphone et terminer sur votre PC.


        ## 🔗 **Modes de synchronisation**


        Tous les appareils supportent les modes Client ou Serveur pour une synchronisation
        flexible. Le Serveur dirige (partage les données), les Clients rejoignent
        et échangent. Au moins un Serveur est nécessaire.


        - **Mode Client :** Se connecte à un Serveur pour synchroniser. Idéal pour
        rejoindre des groupes via QR ou saisie manuelle.

        - **Mode Serveur :** Agit comme un hub ; affiche un QR ou une chaîne pour
        que les autres se connectent.


        **Notes sur les plateformes :**

        - **Mobile :** Basculez via l''icône hotspot Wi-Fi. Serveur pour les hubs
        portables.

        - **Bureau (Par défaut : Serveur) :** Changez dans les paramètres de synchronisation.
        Client pour les ordinateurs portables synchronisant vers les PC principaux.


        **Exemples :** Mobile vers mobile (un Serveur), bureau vers mobile (dans les
        deux sens), bureau vers bureau (un Serveur, un Client).


        Changez les modes dans les paramètres de synchronisation ; l''application
        se souvient de votre choix.


        ## 🛠️ **Activer la synchronisation**


        Les appareils doivent partager le Wi-Fi ; gardez WHPH ouvert.


        ### **Configuration par code QR**

        1. Serveur : Démarrez le mode Serveur dans Synchronisation — le QR apparaît.

        2. Client : "Ajouter un appareil" > Scanner le QR.

        3. Se connecte automatiquement et synchronise.


        Supporte toutes les combinaisons.


        ### **Chaîne de connexion**

        1. Serveur : Copiez la chaîne (ex. "whph://IP:44040?...") depuis Synchronisation.

        2. Client : "Ajouter un appareil" > Manuel > Coller la chaîne > Se connecter.


        Aucune caméra requise.


        ### **Saisie manuelle**

        1. Serveur : Notez l''IP/port (par défaut 44040) depuis les Infos de connexion.

        2. Client : "Ajouter un appareil" > Manuel > Entrez IP, port, nom > Tester
        > Se connecter.


        **Clients Bureau :** Passez d''abord en mode Client, puis connectez-vous.
        Synchronise automatiquement ; repassez quand vous voulez.


        Activez la reconnexion automatique dans les paramètres pour plus de fiabilité.


        ## 📋 **Gérer les appareils**


        - **Afficher :** Voyez les appareils, les heures de synchronisation, le statut
        dans les paramètres de synchronisation.

        - **Synchronisation manuelle :** Appuyez sur le bouton par appareil.

        - **Supprimer :** Sélectionnez et supprimez pour arrêter la synchronisation.


        ## 🔧 **Dépannage**


        **Problèmes de connexion :**

        1. Même Wi-Fi ? Pas de VPN.

        2. Redémarrez l''application.

        3. Vérifiez le mode Serveur.

        4. Testez sans pare-feu.


        **Aucun appareil ?**

        - Wi-Fi stable, pas de proxies.

        - Actualisez le scan.

        - Utilisez l''IP manuelle.


        **Échecs de synchronisation/Délais :**

        1. Synchronisation manuelle.

        2. Vérifiez les versions de l''application.

        3. Attendez pour les grandes quantités de données.


        **Pare-feu (Port 44040) :**


        Si les connexions ne fonctionnent pas, le pare-feu de votre ordinateur pourrait
        bloquer le signal de synchronisation. Ouvrez le port 44040 pour permettre
        aux appareils de communiquer localement — c''est sûr pour votre réseau domestique.


        **Windows (Interface graphique) :**

        1. Ouvrez Defender Firewall > Avancé > Règles entrantes > Nouvelle règle.

        2. Port > TCP > 44040 > Autoriser > Tous les profils > Nommez "WHPH Sync"
        > Terminer.


        **Windows (CMD Admin) :**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW) :**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Conseils : Redémarrez le routeur, utilisez des réseaux privés. Re-pairez en
        cas d''erreurs "non trouvé".

        '
