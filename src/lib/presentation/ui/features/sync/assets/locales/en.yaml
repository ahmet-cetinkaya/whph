    help:
      content: "🔄 **What is Sync?**\n\nSync keeps your habits, tasks, notes, and data updated across your devices on the same Wi-Fi. No cloud or internet: data stays private and local.\n\n## 🛠️ **Enabling Sync**\n\n1. Keep WHPH open on both devices, on the same Wi-Fi.\n2. On one device choose \"Add Device\" and show the QR code.\n3. Scan it with the other device and check that both screens show the same code.\n4. Changes then sync automatically.\n\n## 📋 **Managing Devices**\n\n- **View:** See devices, sync times, and status in Sync settings.\n- **Manual Sync:** Tap the button per device.\n- **Remove:** Select a device and remove it to stop syncing.\n\n## 🔧 **Troubleshooting**\n\n1. Same Wi-Fi? No VPNs.\n2. Restart the app.\n3. Test without a firewall.\n\n**No Devices?**\n- Stable Wi-Fi, no proxies.\n- Refresh the scan."
      title: Device Synchronization Help
