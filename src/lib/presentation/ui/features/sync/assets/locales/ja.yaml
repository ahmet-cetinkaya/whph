    from_label: 送信元
    help:
      content: "🔄 **同期とは？**\n\n同期は、同じWi-Fiにある端末間で、習慣、タスク、メモ、データを最新の状態に保ちます。クラウドもインターネットも不要で、データは非公開のままローカルに保たれます。\n\n## 🛠️ **同期を有効にする**\n\n1. 同じWi-Fiで両方の端末のWHPHを開いたままにします。\n2. 一方の端末で「デバイスを追加」を選び、QRコードを表示します。\n3. もう一方の端末でスキャンし、両方の画面に同じコードが表示されていることを確認します。\n4. 以降、変更は自動的に同期されます。\n\n## 📋 **デバイスの管理**\n\n- **表示:** 同期設定でデバイス、同期時刻、状態を確認できます。\n- **手動同期:** デバイスごとのボタンをタップします。\n- **削除:** デバイスを選んで削除すると同期を停止します。\n\n## 🔧 **トラブルシューティング**\n\n1. 同じWi-Fiですか？VPNは使わないでください。\n2. アプリを再起動します。\n3. ファイアウォールなしで試します。\n\n**デバイスが見つからない場合**\n- 安定したWi-Fiを使い、プロキシは使わないでください。\n- スキャンを更新します。"
      title: デバイス同期ヘルプ
