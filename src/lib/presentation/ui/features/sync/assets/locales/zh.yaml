    from_label: 从
    help:
      content: "🔄 **什么是同步？**\n\n同步可让同一 Wi-Fi 下的各台设备上的习惯、任务、笔记和数据保持最新。无需云端或互联网：数据保持私密并留在本地。\n\n## 🛠️ **启用同步**\n\n1. 在同一 Wi-Fi 下，让两台设备都保持打开 WHPH。\n2. 在一台设备上选择“添加设备”并显示二维码。\n3. 用另一台设备扫描，并确认两个屏幕显示相同的代码。\n4. 之后更改会自动同步。\n\n## 📋 **管理设备**\n\n- **查看：** 在同步设置中查看设备、同步时间和状态。\n- **手动同步：** 点击对应设备的按钮。\n- **移除：** 选择设备并移除即可停止同步。\n\n## 🔧 **故障排除**\n\n1. 是否在同一 Wi-Fi？请关闭 VPN。\n2. 重启应用。\n3. 关闭防火墙后再试。\n\n**没有设备？**\n- 使用稳定的 Wi-Fi，不要使用代理。\n- 刷新扫描。"
      title: 设备同步帮助
