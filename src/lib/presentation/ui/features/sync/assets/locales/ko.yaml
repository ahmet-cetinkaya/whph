    from_label: 보낸 곳
    help:
      content: "🔄 **동기화란?**\n\n동기화는 같은 Wi-Fi에 있는 기기들에서 습관, 작업, 노트, 데이터를 최신 상태로 유지합니다. 클라우드나 인터넷 없이 데이터는 비공개로 로컬에 보관됩니다.\n\n## 🛠️ **동기화 켜기**\n\n1. 같은 Wi-Fi에서 두 기기 모두 WHPH를 열어 두세요.\n2. 한 기기에서 '기기 추가'를 선택하고 QR 코드를 표시하세요.\n3. 다른 기기로 스캔한 뒤 두 화면에 같은 코드가 표시되는지 확인하세요.\n4. 이후 변경 사항이 자동으로 동기화됩니다.\n\n## 📋 **기기 관리**\n\n- **보기:** 동기화 설정에서 기기, 동기화 시간, 상태를 확인합니다.\n- **수동 동기화:** 기기별 버튼을 누릅니다.\n- **제거:** 기기를 선택해 제거하면 동기화가 중지됩니다.\n\n## 🔧 **문제 해결**\n\n1. 같은 Wi-Fi인가요? VPN은 끄세요.\n2. 앱을 다시 시작하세요.\n3. 방화벽 없이 테스트하세요.\n\n**기기가 없나요?**\n- 안정적인 Wi-Fi를 사용하고 프록시는 쓰지 마세요.\n- 검색을 새로고침하세요."
      title: 기기 동기화 도움말
