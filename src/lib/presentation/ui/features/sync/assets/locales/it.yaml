    from_label: Da
    help:
      content: "🔄 **Che cos'è la sincronizzazione?**\n\nLa sincronizzazione mantiene aggiornati abitudini, attività, note e dati sui tuoi dispositivi nella stessa rete Wi-Fi. Niente cloud né internet: i dati restano privati e locali.\n\n## 🛠️ **Attivare la sincronizzazione**\n\n1. Tieni WHPH aperto su entrambi i dispositivi, sulla stessa rete Wi-Fi.\n2. Su un dispositivo scegli «Aggiungi dispositivo» e mostra il codice QR.\n3. Inquadralo con l'altro dispositivo e controlla che entrambi gli schermi mostrino lo stesso codice.\n4. Le modifiche si sincronizzano poi automaticamente.\n\n## 📋 **Gestire i dispositivi**\n\n- **Visualizza:** Vedi dispositivi, orari di sincronizzazione e stato nelle impostazioni di sincronizzazione.\n- **Sincronizzazione manuale:** Tocca il pulsante del dispositivo.\n- **Rimuovi:** Seleziona un dispositivo e rimuovilo per interrompere la sincronizzazione.\n\n## 🔧 **Risoluzione dei problemi**\n\n1. Stessa rete Wi-Fi? Niente VPN.\n2. Riavvia l'app.\n3. Prova senza firewall.\n\n**Nessun dispositivo?**\n- Wi-Fi stabile, nessun proxy.\n- Aggiorna la ricerca."
      title: Aiuto alla sincronizzazione dei dispositivi
