    from_label: Von
    help:
      content: '🔄 **Was ist Sync?**


        Sync hält Ihre Gewohnheiten, Aufgaben, Notizen und Daten auf dem gleichen
        Wi-Fi über Geräte (Handys, Tablets, Laptops, Desktops) aktuell. Kein Cloud
        oder Internet — Daten bleiben privat und lokal.


        Es ist einfach zu bedienen: Richten Sie es einmal ein, und Änderungen synchronisieren
        automatisch oder auf Abruf. Wechseln Sie nahtlos zwischen Geräten, wie Sie
        auf dem Handy anfangen und am PC beenden.


        ## 🔗 **Sync-Modi**


        Alle Geräte unterstützen Client- oder Server-Modi für flexible Synchronisation.
        Server leitet (teilt Daten), Clients schließen sich an und tauschen aus. Mindestens
        ein Server erforderlich.


        - **Client-Modus:** Verbinde mit einem Server zum Synchronisieren. Ideal zum
        Beitreten von Gruppen via QR oder manueller Eingabe.

        - **Server-Modus:** Wirkt als Hub; zeigt QR oder String für andere zum Verbinden.


        **Plattform-Hinweise:**

        - **Mobile:** Umschalten über Wi-Fi-Hotspot-Symbol. Server für tragbare Hubs.

        - **Desktop (Standard: Server):** In Sync-Einstellungen wechseln. Client für
        Laptops, die zu Haupt-PCs synchronisieren.


        **Beispiele:** Mobile-zu-Mobile (ein Server), Desktop-zu-Mobile (in beide
        Richtungen), Desktop-zu-Desktop (ein Server, ein Client).


        Modi in Sync-Einstellungen wechseln; App merkt sich Ihre Wahl.


        ## 🛠️ **Sync aktivieren**


        Geräte müssen Wi-Fi teilen; WHPH offen halten.


        ### **QR-Code-Einrichtung**

        1. Server: Server-Modus in Sync starten — QR erscheint.

        2. Client: "Gerät hinzufügen" > QR scannen.

        3. Verbinde automatisch und synchronisiere.


        Unterstützt alle Kombinationen.


        ### **Verbindungs-String**

        1. Server: String kopieren (z.B. "whph://IP:44040?...") aus Sync.

        2. Client: "Gerät hinzufügen" > Manuell > String einfügen > Verbinden.


        Keine Kamera erforderlich.


        ### **Manuelle Eingabe**

        1. Server: IP/Port (Standard 44040) aus Verbindungsinfo notieren.

        2. Client: "Gerät hinzufügen" > Manuell > IP, Port, Name eingeben > Testen
        > Verbinden.


        **Desktop-Clients:** Zuerst zu Client-Modus wechseln, dann verbinden. Automatische
        Synchronisation; jederzeit zurückwechseln.


        Für Zuverlässigkeit Auto-Reconnect in Einstellungen aktivieren.


        ## 📋 **Geräte verwalten**


        - **Anzeigen:** Geräte, Sync-Zeiten, Status in Sync-Einstellungen sehen.

        - **Manuelle Sync:** Button pro Gerät drücken.

        - **Entfernen:** Auswählen und entfernen, um Sync zu stoppen.


        ## 🔧 **Fehlerbehebung**


        **Verbindungsprobleme:**

        1. Gleiches Wi-Fi? Kein VPN.

        2. App neu starten.

        3. Server-Modus überprüfen.

        4. Ohne Firewall testen.


        **Keine Geräte?**

        - Stabiles Wi-Fi, keine Proxies.

        - Scan aktualisieren.

        - Manuelles IP verwenden.


        **Sync-Fehler/Timeouts:**

        1. Manuelle Sync.

        2. App-Versionen abgleichen.

        3. Für große Daten warten.


        **Firewall (Port 44040):**


        Wenn Verbindungen nicht funktionieren, blockiert möglicherweise Ihre Computer-Firewall
        das Sync-Signal. Öffnen Sie Port 44040, damit Geräte lokal kommunizieren —
        sicher für Ihr Heimnetzwerk.


        **Windows (GUI):**

        1. Defender Firewall öffnen > Erweitert > Eingehende Regeln > Neue Regel.

        2. Port > TCP > 44040 > Erlauben > Alle Profile > "WHPH Sync" nennen > Fertig.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Tipps: Router neu starten, private Netzwerke nutzen. Bei "nicht gefunden"-Fehlern
        neu pairen.

        '
