    from_label: Von
    help:
      content: "🔄 **Was ist Sync?**\n\nSync hält deine Gewohnheiten, Aufgaben, Notizen und Daten auf deinen Geräten im selben WLAN aktuell. Keine Cloud, kein Internet: Die Daten bleiben privat und lokal.\n\n## 🛠️ **Sync aktivieren**\n\n1. Lasse WHPH auf beiden Geräten im selben WLAN geöffnet.\n2. Wähle auf einem Gerät „Gerät hinzufügen“ und zeige den QR-Code an.\n3. Scanne ihn mit dem anderen Gerät und prüfe, dass beide Bildschirme denselben Code zeigen.\n4. Danach werden Änderungen automatisch synchronisiert.\n\n## 📋 **Geräte verwalten**\n\n- **Ansehen:** Geräte, Sync-Zeiten und Status findest du in den Sync-Einstellungen.\n- **Manueller Sync:** Tippe auf die Schaltfläche beim Gerät.\n- **Entfernen:** Wähle ein Gerät und entferne es, um den Sync zu beenden.\n\n## 🔧 **Fehlerbehebung**\n\n1. Gleiches WLAN? Kein VPN.\n2. App neu starten.\n3. Ohne Firewall testen.\n\n**Keine Geräte?**\n- Stabiles WLAN, keine Proxys.\n- Suche aktualisieren."
      title: Hilfe zur Gerätesynchronisation
