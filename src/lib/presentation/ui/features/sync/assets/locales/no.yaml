    from_label: Fra
    help:
      content: '🔄 **Hva er Sync?**


        Sync holder vanene, oppgavene, notatene og dataene dine oppdatert på tvers
        av enheter (telefoner, nettbrett, bærbare datamaskiner, stasjonære) på samme
        Wi-Fi. Ingen sky eller internett — data forblir private og lokale.


        Det er enkelt å bruke: Sett det opp én gang, og endringer synkroniseres automatisk
        eller på forespørsel. Bytt enheter sømløst, som å starte på telefonen og fullføre
        på PC-en.


        ## 🔗 **Synkroniseringsmoduser**


        Alle enheter støtter klient- eller servermodus for fleksibel synkronisering.
        Serveren leder (deler data), klientene blir med og utveksler. Du trenger minst
        én server.


        - **Klientmodus:** Kobler til en server for å synkronisere. Ideell for å bli
        med i grupper via QR eller manuell inntasting.

        - **Servermodus:** Fungerer som nav; viser QR eller streng for andre å koble
        til.


        **Plattformnotater:**

        - **Mobil:** Bytt via Wi-Fi-hotspot-ikonet. Server for bærbare nav.

        - **Skrivebord (Standard: Server):** Bytt i synkroniseringsinnstillinger.
        Klient for bærbare som synkroniserer til hoved-PC-er.


        **Eksempler:** Mobil-til-mobil (én server), skrivebord-til-mobil (begge veier),
        skrivebord-til-skrivebord (én server, én klient).


        Bytt moduser i synkroniseringsinnstillingene; appen husker valget ditt.


        ## 🛠️ **Aktivere Sync**


        Enhetene må dele Wi-Fi; hold WHPH åpen.


        ### **QR-kodeoppsett**

        1. Server: Start servermodus i Sync — QR vises.

        2. Klient: "Legg til enhet" > Skann QR.

        3. Kobler til og synkroniserer automatisk.


        Støtter alle kombinasjoner.


        ### **Tilkoblingsstreng**

        1. Server: Kopier strengen (f.eks. "whph://IP:44040?...") fra Sync.

        2. Klient: "Legg til enhet" > Manuell > Lim inn streng > Koble til.


        Krever ikke kamera.


        ### **Manuell inntasting**

        1. Server: Noter IP/port (standard 44040) fra tilkoblingsinfo.

        2. Klient: "Legg til enhet" > Manuell > Skriv inn IP, port, navn > Test >
        Koble til.


        **Skrivebordsklienter:** Bytt til klientmodus først, deretter koble til. Synkroniserer
        automatisk; bytt tilbake når som helst.


        Aktiver automatisk gjenkobling i innstillingene for pålitelighet.


        ## 📋 **Håndtere enheter**


        - **Vis:** Se enheter, synkroniseringstider, status i synkroniseringsinnstillingene.

        - **Manuell synkronisering:** Trykk knapp per enhet.

        - **Fjern:** Velg og fjern for å stoppe synkronisering.


        ## 🔧 **Feilsøking**


        **Tilkoblingsproblemer:**

        1. Samme Wi-Fi? Ingen VPN-er.

        2. Start appen på nytt.

        3. Bekreft servermodus.

        4. Test uten brannmur.


        **Ingen enheter?**

        - Stabil Wi-Fi, ingen proxyer.

        - Oppdater skanning.

        - Bruk manuell IP.


        **Synkronisering mislykkes/timeout:**

        1. Manuell synkronisering.

        2. Matcher app-versjoner.

        3. Vent på store data.


        **Brannmur (Port 44040):**


        Hvis tilkoblinger ikke fungerer, kan brannmuren på datamaskinen blokkere synkroniseringssignalet.
        Åpne port 44040 for å la enhetene kommunisere lokalt — det er trygt for hjemmenettverket
        ditt.


        **Windows (GUI):**

        1. Åpne Defender-brannmur > Avansert > Inngående regler > Ny regel.

        2. Port > TCP > 44040 > Tillat > Alle profiler > Navngi "WHPH Sync" > Fullfør.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Tips: Start ruteren på nytt, bruk private nettverk. Par på nytt ved "ikke
        funnet"-feil.

        '
