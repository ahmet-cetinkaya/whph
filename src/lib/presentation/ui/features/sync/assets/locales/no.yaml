    from_label: Fra
    help:
      content: "🔄 **Hva er synkronisering?**\n\nSynkronisering holder vanene, oppgavene, notatene og dataene dine oppdatert på enhetene dine på samme Wi-Fi. Ingen sky eller internett: dataene forblir private og lokale.\n\n## 🛠️ **Slå på synkronisering**\n\n1. Hold WHPH åpen på begge enhetene, på samme Wi-Fi.\n2. Velg «Legg til enhet» på den ene enheten og vis QR-koden.\n3. Skann den med den andre enheten og sjekk at begge skjermene viser samme kode.\n4. Endringer synkroniseres deretter automatisk.\n\n## 📋 **Administrer enheter**\n\n- **Vis:** Se enheter, synkroniseringstidspunkter og status i synkroniseringsinnstillingene.\n- **Manuell synkronisering:** Trykk på knappen ved enheten.\n- **Fjern:** Velg en enhet og fjern den for å stoppe synkroniseringen.\n\n## 🔧 **Feilsøking**\n\n1. Samme Wi-Fi? Ingen VPN.\n2. Start appen på nytt.\n3. Test uten brannmur.\n\n**Ingen enheter?**\n- Stabilt Wi-Fi, ingen proxy.\n- Oppdater søket."
      title: Hjelp til enhetssynkronisering
