    from_label: Fra
    help:
      content: "🔄 **Hvad er synkronisering?**\n\nSynkronisering holder dine vaner, opgaver, noter og data opdateret på tværs af dine enheder på samme Wi-Fi. Ingen sky eller internet: data forbliver private og lokale.\n\n## 🛠️ **Aktivér synkronisering**\n\n1. Hold WHPH åben på begge enheder på samme Wi-Fi.\n2. Vælg \"Tilføj enhed\" på den ene enhed, og vis QR-koden.\n3. Scan den med den anden enhed, og tjek at begge skærme viser den samme kode.\n4. Ændringer synkroniseres derefter automatisk.\n\n## 📋 **Administrer enheder**\n\n- **Vis:** Se enheder, synkroniseringstidspunkter og status i synkroniseringsindstillinger.\n- **Manuel synkronisering:** Tryk på knappen ved enheden.\n- **Fjern:** Vælg en enhed og fjern den for at stoppe synkroniseringen.\n\n## 🔧 **Fejlfinding**\n\n1. Samme Wi-Fi? Ingen VPN.\n2. Genstart appen.\n3. Prøv uden firewall.\n\n**Ingen enheder?**\n- Stabilt Wi-Fi, ingen proxy.\n- Opdater scanningen."
      title: Hjælp til enhedssynkronisering
