    from_label: Fra
    help:
      content: '🔄 **Hvad er Sync?**


        Sync holder dine vaner, opgaver, noter og data opdateret på tværs af enheder
        (telefoner, tablets, laptops, desktops) på samme Wi-Fi. Ingen cloud eller
        internet — data forbliver private og lokale.


        Det er enkelt at bruge: Opsæt det én gang, og ændringer synkroniseres automatisk
        eller på forespørgsel. Skift mellem enheder sømløst, som at starte på din
        telefon og afslutte på din PC.


        ## 🔗 **Sync-tilstande**


        Alle enheder understøtter Klient- eller Server-tilstande for fleksibel synkronisering.
        Server leder (deler data), Klienter tilslutter og udveksler. Du har brug for
        mindst én Server.


        - **Klient-tilstand:** Tilslutter til en Server for at synkronisere. Ideel
        til at tilslutte grupper via QR eller manuel input.

        - **Server-tilstand:** Fungerer som hub; viser QR eller streng for andre at
        tilslutte.


        **Platform-bemærkninger:**

        - **Mobil:** Skift via Wi-Fi hotspot-ikonet. Server for bærbare hubs.

        - **Desktop (Standard: Server):** Skift i Sync-indstillinger. Klient for laptops,
        der synkroniserer til hoved-PC''er.


        **Eksempler:** Mobil-til-mobil (én Server), desktop-til-mobil (begge veje),
        desktop-til-desktop (én Server, én Klient).


        Skift tilstande i Sync-indstillinger; appen husker dit valg.


        ## 🛠️ **Aktivering af Sync**


        Enheder skal dele Wi-Fi; hold WHPH åben.


        ### **QR-kode-opsætning**

        1. Server: Start Server-tilstand i Sync — QR vises.

        2. Klient: "Tilføj enhed" > Scan QR.

        3. Auto-forbinder og synkroniserer.


        Understøtter alle kombinationer.


        ### **Forbindelsesstreng**

        1. Server: Kopier streng (f.eks. "whph://IP:44040?...") fra Sync.

        2. Klient: "Tilføj enhed" > Manuel > Indsæt streng > Tilslut.


        Ingen kamera kræves.


        ### **Manuel indtastning**

        1. Server: Notér IP/port (standard 44040) fra Forbindelsesinfo.

        2. Klient: "Tilføj enhed" > Manuel > Indtast IP, port, navn > Test > Tilslut.


        **Desktop-klienter:** Skift til Klient-tilstand først, derefter tilslut. Auto-synkroniserer;
        skift tilbage når som helst.


        Aktivér auto-genforbindelse i indstillinger for pålidelighed.


        ## 📋 **Håndtering af enheder**


        - **Vis:** Se enheder, synkroniseringstider, status i Sync-indstillinger.

        - **Manuel Sync:** Tryk knap pr. enhed.

        - **Fjern:** Vælg og fjern for at stoppe synkronisering.


        ## 🔧 **Fejlfinding**


        **Forbindelsesproblemer:**

        1. Samme Wi-Fi? Ingen VPN''er.

        2. Genstart app.

        3. Bekræft Server-tilstand.

        4. Test uden firewall.


        **Ingen enheder?**

        - Stabil Wi-Fi, ingen proxies.

        - Opdater scan.

        - Brug manuel IP.


        **Sync fejler/timeouts:**

        1. Manuel sync.

        2. Match app-versioner.

        3. Vent på store data.


        **Firewall (Port 44040):**


        Hvis forbindelser ikke virker, kan din computers firewall blokere sync-signalet.
        Åbn port 44040 for at lade enheder kommunikere lokalt — det er sikkert for
        dit hjemmenetværk.


        **Windows (GUI):**

        1. Åbn Defender Firewall > Avanceret > Indgående regler > Ny regel.

        2. Port > TCP > 44040 > Tillad > Alle profiler > Navn "WHPH Sync" > Færdig.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Tips: Genstart router, brug private netværk. Gen-par ved "ikke fundet" fejl.

        '
