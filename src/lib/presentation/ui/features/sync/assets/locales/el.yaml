    from_label: Από
    help:
      content: "🔄 **Τι είναι ο συγχρονισμός;**\n\nΟ συγχρονισμός διατηρεί τις συνήθειες, τις εργασίες, τις σημειώσεις και τα δεδομένα σας ενημερωμένα στις συσκευές σας που βρίσκονται στο ίδιο Wi-Fi. Χωρίς cloud ή διαδίκτυο: τα δεδομένα μένουν ιδιωτικά και τοπικά.\n\n## 🛠️ **Ενεργοποίηση συγχρονισμού**\n\n1. Κρατήστε το WHPH ανοιχτό και στις δύο συσκευές, στο ίδιο Wi-Fi.\n2. Σε μία συσκευή επιλέξτε «Προσθήκη συσκευής» και εμφανίστε τον κωδικό QR.\n3. Σαρώστε τον με την άλλη συσκευή και ελέγξτε ότι και οι δύο οθόνες δείχνουν τον ίδιο κωδικό.\n4. Οι αλλαγές συγχρονίζονται στη συνέχεια αυτόματα.\n\n## 📋 **Διαχείριση συσκευών**\n\n- **Προβολή:** Δείτε συσκευές, ώρες συγχρονισμού και κατάσταση στις ρυθμίσεις συγχρονισμού.\n- **Χειροκίνητος συγχρονισμός:** Πατήστε το κουμπί δίπλα στη συσκευή.\n- **Αφαίρεση:** Επιλέξτε μια συσκευή και αφαιρέστε την για να σταματήσει ο συγχρονισμός.\n\n## 🔧 **Αντιμετώπιση προβλημάτων**\n\n1. Ίδιο Wi-Fi; Χωρίς VPN.\n2. Επανεκκινήστε την εφαρμογή.\n3. Δοκιμάστε χωρίς τείχος προστασίας.\n\n**Καμία συσκευή;**\n- Σταθερό Wi-Fi, χωρίς proxy.\n- Ανανεώστε την αναζήτηση."
      title: Βοήθεια Συγχρονισμού Συσκευών
