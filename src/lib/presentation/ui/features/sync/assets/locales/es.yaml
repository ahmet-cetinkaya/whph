    from_label: De
    help:
      content: "🔄 **¿Qué es la sincronización?**\n\nLa sincronización mantiene tus hábitos, tareas, notas y datos actualizados en tus dispositivos conectados a la misma red Wi-Fi. Sin nube ni internet: los datos siguen siendo privados y locales.\n\n## 🛠️ **Activar la sincronización**\n\n1. Mantén WHPH abierto en ambos dispositivos, en la misma red Wi-Fi.\n2. En un dispositivo elige «Añadir dispositivo» y muestra el código QR.\n3. Escanéalo con el otro dispositivo y comprueba que ambas pantallas muestran el mismo código.\n4. Después los cambios se sincronizan automáticamente.\n\n## 📋 **Gestionar dispositivos**\n\n- **Ver:** Consulta dispositivos, horas de sincronización y estado en los ajustes de sincronización.\n- **Sincronización manual:** Pulsa el botón de cada dispositivo.\n- **Quitar:** Selecciona un dispositivo y quítalo para dejar de sincronizar.\n\n## 🔧 **Solución de problemas**\n\n1. ¿Misma red Wi-Fi? Sin VPN.\n2. Reinicia la aplicación.\n3. Prueba sin cortafuegos.\n\n**¿Sin dispositivos?**\n- Wi-Fi estable, sin proxy.\n- Actualiza la búsqueda."
      title: Ayuda de sincronización de dispositivos
