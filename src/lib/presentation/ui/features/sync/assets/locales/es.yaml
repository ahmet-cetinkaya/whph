    from_label: De
    help:
      content: '🔄 **¿Qué es Sync?**


        Sync mantiene sus hábitos, tareas, notas y datos actualizados en todos los
        dispositivos (teléfonos, tablets, laptops, desktops) en la misma red Wi-Fi.
        Sin cloud ni internet — los datos permanecen privados y locales.


        Es simple de usar: Configúrelo una vez, y los cambios se sincronizan automáticamente
        o bajo demanda. Cambie de dispositivos sin problemas, como empezar en su teléfono
        y terminar en su PC.


        ## 🔗 **Modos de Sync**


        Todos los dispositivos soportan modos Cliente o Servidor para sincronización
        flexible. El Servidor lidera (comparte datos), los Clientes se unen y intercambian.
        Necesita al menos un Servidor.


        - **Modo Cliente:** Se conecta a un Servidor para sincronizar. Ideal para
        unirse a grupos vía QR o entrada manual.

        - **Modo Servidor:** Actúa como hub; muestra QR o cadena para que otros se
        conecten.


        **Notas de Plataforma:**

        - **Móvil:** Cambie vía icono de hotspot Wi-Fi. Servidor para hubs portátiles.

        - **Desktop (Predeterminado: Servidor):** Cambie en ajustes de Sync. Cliente
        para laptops sincronizando con PCs principales.


        **Ejemplos:** Móvil-a-móvil (un Servidor), desktop-a-móvil (cualquiera de
        las formas), desktop-a-desktop (un Servidor, un Cliente).


        Cambie modos en ajustes de Sync; la app recuerda su elección.


        ## 🛠️ **Habilitar Sync**


        Los dispositivos deben compartir Wi-Fi; mantenga WHPH abierto.


        ### **Configuración con Código QR**

        1. Servidor: Inicie modo Servidor en Sync — aparece QR.

        2. Cliente: "Agregar Dispositivo" > Escanear QR.

        3. Se conecta y sincroniza automáticamente.


        Soporta todas las combinaciones.


        ### **Cadena de Conexión**

        1. Servidor: Copie cadena (e.g., "whph://IP:44040?...") de Sync.

        2. Cliente: "Agregar Dispositivo" > Manual > Pegar cadena > Conectar.


        No requiere cámara.


        ### **Entrada Manual**

        1. Servidor: Note IP/puerto (predeterminado 44040) de Info de Conexión.

        2. Cliente: "Agregar Dispositivo" > Manual > Ingresar IP, puerto, nombre >
        Test > Conectar.


        **Clientes de Desktop:** Cambie a modo Cliente primero, luego conecte. Se
        sincroniza automáticamente; cambie de vuelta cuando quiera.


        Habilite reconexión automática en ajustes para fiabilidad.


        ## 📋 **Gestionar Dispositivos**


        - **Ver:** Ve dispositivos, tiempos de sync, estado en ajustes de Sync.

        - **Sync Manual:** Toque botón por dispositivo.

        - **Eliminar:** Seleccione y elimine para detener sync.


        ## 🔧 **Solución de Problemas**


        **Problemas de Conexión:**

        1. ¿Misma Wi-Fi? Sin VPNs.

        2. Reiniciar app.

        3. Verificar modo Servidor.

        4. Test sin firewall.


        **¿No Dispositivos?**

        - Wi-Fi estable, sin proxies.

        - Refrescar escaneo.

        - Usar IP manual.


        **Sync Falla/Timeouts:**

        1. Sync manual.

        2. Coincida versiones de app.

        3. Esperar datos grandes.


        **Firewall (Puerto 44040):**


        Si las conexiones no funcionan, el firewall de su computadora podría bloquear
        la señal de sync. Abra el puerto 44040 para permitir que los dispositivos
        se comuniquen localmente — es seguro para su red doméstica.


        **Windows (GUI):**

        1. Abra Defender Firewall > Avanzado > Reglas de Entrada > Nueva Regla.

        2. Puerto > TCP > 44040 > Permitir > Todos los perfiles > Nombre "WHPH Sync"
        > Finalizar.


        **Windows (Admin CMD):**

        ```

        netsh advfirewall firewall add rule name="WHPH Sync" dir=in action=allow protocol=TCP
        localport=44040

        ```


        **Linux (UFW):**

        ```

        sudo ufw allow 44040/tcp && sudo ufw reload

        ```


        Consejos: Reiniciar router, usar redes privadas. Re-emparejar si errores "no
        encontrado".

        '
