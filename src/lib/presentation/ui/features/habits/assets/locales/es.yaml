      description:
        Visualiza y gestiona todos tus hábitos aquí. Haz clic en cualquier
        hábito para ver detalles, estadísticas e historial de finalización. Marca
        hábitos como completados diariamente para construir rachas y rastrear tu progreso.
    calendar_view:
      title: Vista de calendario
      description:
        Visualiza tu historial de finalización de hábitos a lo largo de
        varios días. El verde indica hábitos completados. Realiza un seguimiento de
        tu consistencia y observa tus patrones de progreso a lo largo del tiempo.
    filter_search:
      title: Filtrar y buscar
      description:
        Encuentra hábitos específicos usando etiquetas, términos de búsqueda
        o filtra por estado archivado. Organiza y gestiona tus hábitos de manera eficiente
        para mantenerte enfocado en lo que importa.
