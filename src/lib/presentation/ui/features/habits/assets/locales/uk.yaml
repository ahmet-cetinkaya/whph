  overview:
    filter_by_tags_tooltip: Фільтрувати за тегами
    help:
      content:
        "Опануйте свої щоденні рутини через систематичне відстеження звичок,
        яке будує послідовність, створює позитивний імпульс та стимулює значущий прогрес
        до довгострокових цілей.


        ## ⚡ Чому це важливо?


        Щоденне управління звичками - це основа особистої досконалості та стійкого
        зростання. Послідовне виконання добре спланованих звичок створює складні переваги
        з часом, тоді як систематичне відстеження забезпечує підтримку відповідальності
        та внесення покращень на основі даних до рутин.


        ## 📅 Щоденне виконання та відстеження


        Розвивайте надійну систему виконання та моніторингу звичок, яка створює послідовність
        та будує нестримний імпульс до ваших цілей.


        - ✅ **Щоденне завершення:** Позначайте звички як завершені для побудови ланцюгів
        послідовності

        - 📆 **Багатоденний вигляд:** Відстежуйте шаблони протягом днів та тижнів для
        комплексних інсайтів

        - 🔄 **Побудова серій:** Підтримуйте послідовні дні завершення для максимізації
        мотиваційного імпульсу

        - 📊 **Візуалізація прогресу:** Відстежуйте показники завершення та шаблони
        з часом


        ## ⏱️ Аналіз часу та оптимізація


        Відстежуйте часові інвестиції у ваші звички для оптимізації щоденного розкладу
        та забезпечення збалансованого розвитку в усіх важливих сферах життя.


        - ⏳ **Відстеження тривалості:** Записуйте фактичний витрачений час для розуміння
        вимог звички

        - 🏷️ **Аналіз категорій:** Групуйте звички за тегами для перегляду розподілу
        часу по сферах життя

        - ⏰ **Оптимізація розкладу:** Балансуйте час звичок для стійкого щоденного
        виконання

        - 📈 **Покращення ефективності:** Виявляйте можливості для оптимізації виконання
        звичок


        ## 🗂️ Стратегічна організація


        Створіть організаційну систему, яка підтримує послідовне виконання, забезпечуючи
        гнучкість для адаптації до змінних цілей та обставин.


        - 🏷️ **Значуща категоризація:** Групуйте звички за сферою життя, часом або
        рівнем пріоритету

        - ⚙️ **Гнучке планування:** Розробляйте час звичок, який працює з вашим способом
        життя та шаблонами енергії

        - 🎯 **Фокус на пріоритетах:** Забезпечте, щоб ваші найважливіші звички отримували
        відповідну увагу та енергію


        ## 💡 Принципи майстерності


        Застосовуйте перевірені стратегії майстерності звичок, які забезпечують, що
        ваші зусилля накопичуються в тривалі поведінкові зміни та вимірювані покращення
        життя.


        - 🐾 **Почніть з малого:** Розпочніть зі звичок, які ви можете виконувати послідовно,
        потім поступово збільшуйте складність

        - 🏷️ **Стратегічне групування:** Організовуйте звички для створення логічних
        послідовностей та систем підтримки

        - 📊 **Огляд продуктивності:** Використовуйте дані відстеження часу для розуміння
        шаблонів та оптимізації підходу

        - 🌅 **Виконання в найкращий час:** Плануйте найважливіші звички під час пікових
        періодів енергії


        ### 📊 Використання вигляду календаря

        - 📅 Переглядайте кілька днів одночасно у вигляді календаря.

        - ✅ Візуально відстежуйте свої шаблони завершення.

        - ⚡ Економте час завдяки швидкому позначенню завершення.

        - 🎯 Підвищуйте мотивацію завдяки візуальному відстеженню серій.

        - 🔄 Досліджуйте минулі та майбутні звички з гнучкою навігацією дат.

        "
